<!doctype html>
<html lang="pt-br">
  <head>
    <title>Template</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <form action="/agendamento" method="POST">
      <div class="container">
        <h1 class="text-center mt-3">Agendamento</h1>

        <h2 class="mt-4">Dados do paciente</h2>

        <div class="row mt-4">
          <div class="col-6">
            <label class="form-label">Nome</label>
            <input name="nome" type="text" class="form-control" required />
          </div>

          <div class="col-6">
            <label class="form-label">Sobrenome</label>
            <input name="sobrenome" type="text" class="form-control" required />
          </div>
        </div>

        <div class="row mt-3">
          <div class="col-6">
            <label class="form-label">CPF</label>
            <input name="cpf" type="text" class="form-control" required />
          </div>

          <div class="col-6">
            <label class="form-label">Data de nascimento</label>
            <input
              name="nascimento"
              type="date"
              class="form-control"
              required
            />
          </div>
        </div>

        <div class="row mt-3">
          <div class="col-6">
            <label class="form-label">Telefone</label>
            <input name="telefone" type="text" class="form-control" required />
          </div>

          <div class="col-6">
            <label class="form-label">CEP</label>
            <input name="cep" type="text" class="form-control" required />
          </div>
        </div>

        <div class="row mt-3">
          <div class="col-12">
            <label class="form-label">Endereço</label>
            <input name="endereco" type="text" class="form-control" required />
          </div>
        </div>

        <h2 class="mt-4">Dados da consulta</h2>

        <div class="row mt-4">
          <div class="col-6">
            <label class="form-label">Clínica</label>
            <select name="clinica" class="form-select" required>
              <option value="" selected disabled>Selecione uma Clínica</option>
              <option>Taguatinga</option>
              <option>Ceilândia</option>
            </select>
          </div>

          <div class="col-6">
            <label class="form-label">Especialidade</label>
            <select name="especialidade" class="form-select" required>
              <option value="" selected disabled>
                Selecione uma Especialidade
              </option>
              <option>Pediatria</option>
              <option>Cardiologia</option>
            </select>
          </div>
        </div>

        <div class="row mt-3">
          <div class="col-6">
            <label class="form-label">Data</label>
            <input
              id="dataConsulta"
              name="data"
              type="date"
              class="form-control"
              required
            />

            <script>
              const hoje = new Date().toISOString().split("T")[0];
              document.getElementById("dataConsulta").min = hoje;
            </script>
          </div>

          <div class="col-6">
            <label class="form-label">Hora</label>
            <input name="hora" type="time" class="form-control" required />
          </div>
        </div>

        <div class="row mt-3">
          <div class="col-12">
            <label class="form-label">Observação</label>
            <input name="observacao" type="text" class="form-control" />
          </div>
        </div>
        <div class="row mt-4">
          <div class="col-12">
            <button type="submit" class="btn btn-primary w-100 btn-lg">
              Enviar
            </button>
          </div>
        </div>
      </div>
    </form>
  </body>
</html>
